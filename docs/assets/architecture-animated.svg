    <linearGradient id="cardGradCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1930" stop-opacity="0.94" />
      <stop offset="100%" stop-color="#071020" stop-opacity="0.98" />
