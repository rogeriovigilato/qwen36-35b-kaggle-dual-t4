    <linearGradient id="cardGradPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#191233" stop-opacity="0.94" />
      <stop offset="100%" stop-color="#0d0920" stop-opacity="0.98" />
    </linearGradient>

    <linearGradient id="cardGradEmerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#082420" stop-opacity="0.94" />
      <stop offset="100%" stop-color="#051514" stop-opacity="0.98" />
    </linearGradient>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
