    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #94a3b8; }
    .node-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13.5px; font-weight: 700; letter-spacing: 0.4px; }
    .node-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; fill: #94a3b8; }
    .badge { font-family: Consolas, monospace; font-size: 9.5px; font-weight: 700; }
    .item-text { font-family: Consolas, monospace; font-size: 10px; fill: #cbd5e1; }
    .mono { font-family: Consolas, monospace; }
    .flow-line { stroke-dasharray: 6 6; animation: dash 1.6s linear infinite; }
    .flow-line-rev { stroke-dasharray: 6 6; animation: dashRev 1.6s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -24; } }
    @keyframes dashRev { to { stroke-dashoffset: 24; } }
  </style>

